<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>断食道場SHOP BF TDA広告バナー</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@900&family=Tilt+Neon&display=swap" rel="stylesheet">
<style>
/* TDA広告用：tda.html?s=545（1500x545）/ ?s=234（1500x234）
   ルール：文字サイズ 28px〜80px／日付・ボタンなし／黒背景／看板・キャッチ・写真のみ */
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#000;overflow:hidden}
body{font-family:"Noto Sans JP",sans-serif;color:#fff}
.bn{position:relative;width:1500px;overflow:hidden;background:#000}
.halo{position:absolute;border-radius:50%;background:radial-gradient(closest-side,#ffe3ef 0%,#ff9cc8 26%,#ff4f9a99 55%,#ff3d8b33 78%,transparent);filter:blur(24px)}
.glow2{position:absolute;border-radius:50%;background:radial-gradient(closest-side,#ff3d8b55,transparent);filter:blur(30px)}
.bt{position:absolute;bottom:0;filter:drop-shadow(0 0 2px #ffe3efaa) drop-shadow(0 0 14px #ff6fb280)}
.pf{position:absolute;filter:drop-shadow(0 6px 10px #000c)}
.neon{font-family:"Tilt Neon",sans-serif;color:#ffe9f3;line-height:1;letter-spacing:.03em;white-space:nowrap;
  text-shadow:0 0 2px #fff,0 0 8px #ff4fa3,0 0 20px #ff4fa3,0 0 44px #ff2f8f,0 0 80px #ff2f8f99}
.kick{font-weight:900;white-space:nowrap;color:#fff;text-shadow:0 0 4px #fff,0 0 14px #ff7ab6;letter-spacing:.06em}
.tw{position:absolute;width:var(--s);height:var(--s);margin:calc(var(--s)/-2) 0 0 calc(var(--s)/-2);background:radial-gradient(circle,#fff 0 8%,#ffb6d6aa 14%,transparent 40%)}
.tw::before,.tw::after{content:"";position:absolute;left:50%;top:50%;filter:drop-shadow(0 0 3px #ff7ab6)}
.tw::before{width:2px;height:100%;margin:-50% 0 0 -1px;background:linear-gradient(transparent,#fff 50%,transparent)}
.tw::after{width:100%;height:2px;margin:-1px 0 0 -50%;background:linear-gradient(90deg,transparent,#fff 50%,transparent)}
.mt{position:absolute;width:200px;height:3px;border-radius:2px;background:linear-gradient(90deg,transparent,#ff9cc8 70%,#fff);box-shadow:0 0 8px #ff7ab6;transform:rotate(148deg);transform-origin:0 50%}

.frame{display:inline-block;border:4px solid #fff3f8;border-radius:22px;box-shadow:0 0 6px #fff,0 0 18px #ff4fa3,0 0 40px #ff2f8f,inset 0 0 18px #ff2f8f88}
.s545 .frame{margin-top:34px;padding:34px 70px 38px}
.s545 .frame .neon{margin-top:0}
.s234 .frame{padding:20px 34px 24px;border-width:3px;border-radius:16px}
/* ===== 1500x545 ===== */
.s545 .bn{height:545px}
.s545 .halo{left:120px;top:60px;width:560px;height:560px}
.s545 .glow2{left:820px;top:60px;width:620px;height:420px}
.s545 .bt{width:104px}
.s545 .b1{left:140px;bottom:-10px;width:98px}
.s545 .b2{left:230px;bottom:6px}
.s545 .b3{left:338px;bottom:16px;width:116px;z-index:2}
.s545 .b4{left:452px;bottom:6px}
.s545 .b5{left:560px;bottom:-10px;width:98px}
.s545 .pf{width:56px}
.s545 .copy{position:absolute;left:760px;right:40px;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.s545 .kick{font-size:48px}
.s545 .neon{margin-top:34px;font-size:80px}
.s545 .neon span{display:block}
.s545 .neon span+span{margin-top:18px}

/* ===== 1500x234 ===== */
.s234 .bn{height:234px}
.s234 .halo{left:600px;top:-10px;width:420px;height:300px}
.s234 .glow2{left:40px;top:-20px;width:560px;height:280px}
.s234 .bt{width:50px}
.s234 .b1{left:660px;bottom:-30px;width:47px}
.s234 .b2{left:704px;bottom:-22px}
.s234 .b3{left:754px;bottom:-14px;width:56px;z-index:2}
.s234 .b4{left:810px;bottom:-22px}
.s234 .b5{left:858px;bottom:-30px;width:47px}
.s234 .pf{width:30px}
.s234 .copyL{position:absolute;left:24px;width:600px;top:0;bottom:0;display:flex;align-items:center;justify-content:center}
.s234 .neon{font-size:72px}
.s234 .copyR{position:absolute;left:960px;right:40px;top:0;bottom:0;display:flex;align-items:center;justify-content:center}
.s234 .kick{font-size:40px}
</style>
</head>
<body>
<script>document.body.className='s'+((location.search.match(/s=(\d+)/)||[])[1]||'545');</script>
<div class="bn">
  <span class="glow2"></span>
  <i class="tw" style="left:5%;top:18%;--s:26px"></i><i class="tw" style="left:47%;top:12%;--s:30px"></i>
  <i class="tw" style="left:96%;top:16%;--s:24px"></i><i class="tw" style="left:58%;top:84%;--s:20px"></i>
  <i class="tw" style="left:30%;top:8%;--s:18px"></i><i class="tw" style="left:90%;top:82%;--s:26px"></i>
  <i class="tw" style="left:3%;top:76%;--s:20px"></i><i class="tw" style="left:68%;top:26%;--s:16px"></i>
  <b class="mt" style="left:56%;top:6%"></b><b class="mt" style="left:100%;top:46%"></b>

  <span class="halo"></span>
  <div data-only="545">
    <img class="pf" src="../images/pk-mik.png" style="left:70px;top:90px;transform:rotate(-18deg)">
    <img class="pf" src="../images/pk-zak.png" style="left:40px;top:300px;transform:rotate(14deg)">
    <img class="pf" src="../images/pk-ume.png" style="left:360px;top:-6px;transform:rotate(-24deg)">
    <img class="pf" src="../images/pk-wak.png" style="left:640px;top:70px;transform:rotate(16deg)">
    <img class="pf" src="../images/pk-std.png" style="left:690px;top:300px;transform:rotate(-10deg)">
  </div>
  <div data-only="234">
    <img class="pf" src="../images/pk-mik.png" style="left:614px;top:24px;transform:rotate(-20deg)">
    <img class="pf" src="../images/pk-zak.png" style="left:636px;top:130px;transform:rotate(16deg)">
    <img class="pf" src="../images/pk-wak.png" style="left:906px;top:20px;transform:rotate(18deg)">
    <img class="pf" src="../images/pk-std.png" style="left:902px;top:126px;transform:rotate(-12deg)">
  </div>
  <img class="bt b1" src="../images/bt-wak.png">
  <img class="bt b2" src="../images/bt-ume.png">
  <img class="bt b3" src="../images/bt-std.png">
  <img class="bt b4" src="../images/bt-zak.png">
  <img class="bt b5" src="../images/bt-mik.png">

  <div class="copy" data-only="545">
    <p class="kick">ファスティングはじめるなら今！</p>
    <div class="frame"><p class="neon"><span>BLACK</span><span>FRIDAY</span></p></div>
  </div>
  <div class="copyL" data-only="234"><div class="frame"><p class="neon">BLACK FRIDAY</p></div></div>
  <div class="copyR" data-only="234"><p class="kick">ファスティング<br>はじめるなら今！</p></div>
</div>
<script>
var s=document.body.className.slice(1);
document.querySelectorAll('[data-only]').forEach(function(e){if(e.getAttribute('data-only')!==s)e.remove();});
</script>
</body>
</html>
