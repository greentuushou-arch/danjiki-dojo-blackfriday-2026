<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>断食道場SHOP BF 誘導バナー</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600&family=Noto+Sans+JP:wght@700;900&family=Tilt+Neon&display=swap" rel="stylesheet">
<style>
/* 使い方: banner.html?s=900 / ?s=311 → sh export.sh で 1600x900・1600x311 を書き出し */
:root{--ink:#0c0a0d;--pink:#ff4f9a;--pink-d:#c21862;--pink-l:#ffb8d7;--cream:#fff5cf;--red:#e3122d;
  --g-pink:linear-gradient(100deg,#ff3d8b 0%,#ff8cc1 35%,#ffd2e6 50%,#ff7ab6 66%,#ff3d8b 100%)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--ink);overflow:hidden}
body{font-family:"Noto Sans JP",sans-serif;color:#fff;letter-spacing:.04em}
.bn{position:relative;width:1600px;overflow:hidden;
  background:radial-gradient(ellipse 34% 62% at 24% 58%,#7a1747 0%,#3a0c24 45%,transparent 75%),radial-gradient(ellipse 40% 50% at 76% 30%,#2c0a1c,transparent 70%),#0b080c}
.num{font-family:"Jost",sans-serif;font-weight:600}
.pk{background:var(--g-pink);-webkit-background-clip:text;background-clip:text;color:transparent}
.neon{font-family:"Tilt Neon",sans-serif;color:#ffe9f3;line-height:.95;letter-spacing:.03em;
  text-shadow:0 0 2px #fff,0 0 8px #ff4fa3,0 0 20px #ff4fa3,0 0 46px #ff2f8f,0 0 90px #ff2f8f99}
/* 瓶・パウチ */
.stage{position:absolute}
.halo{position:absolute;border-radius:50%;background:radial-gradient(closest-side,#fff0f6 0%,#ffb3d4 30%,#ff5fa6b3 58%,#ff3d8b40 80%,transparent);filter:blur(26px)}
.bt{position:absolute;bottom:0;filter:drop-shadow(0 0 2px #ffe3ef99) drop-shadow(0 0 16px #ff6fb280)}
.pf{position:absolute;filter:drop-shadow(0 8px 12px #000b)}
/* 星 */
.tw{position:absolute;width:var(--s);height:var(--s);margin:calc(var(--s)/-2) 0 0 calc(var(--s)/-2);background:radial-gradient(circle,#fff 0 8%,#ffb6d6aa 14%,transparent 40%)}
.tw::before,.tw::after{content:"";position:absolute;left:50%;top:50%;filter:drop-shadow(0 0 3px #ff7ab6)}
.tw::before{width:2px;height:100%;margin:-50% 0 0 -1px;background:linear-gradient(transparent,#fff 50%,transparent)}
.tw::after{width:100%;height:2px;margin:-1px 0 0 -50%;background:linear-gradient(90deg,transparent,#fff 50%,transparent)}
.mt{position:absolute;width:220px;height:3px;border-radius:2px;background:linear-gradient(90deg,transparent,#ff9cc8 70%,#fff);box-shadow:0 0 8px #ff7ab6;transform:rotate(148deg);transform-origin:0 50%}
/* テキスト共通 */
.kick{font-weight:900;color:#fff;text-shadow:0 0 4px #fff,0 0 14px #ff7ab6;white-space:nowrap}
.cp{display:flex;align-items:flex-end;line-height:.8;white-space:nowrap}
.cp .lb{font-weight:900;color:#fff}
.cp .n{font-family:"Jost",sans-serif;font-weight:600;letter-spacing:-.02em}
.cp .o{font-family:"Jost",sans-serif;font-weight:600}
.cp .o small{display:block;letter-spacing:.3em;color:var(--pink-l);font-weight:500}
.stamp{border-radius:50%;background:#fff;color:var(--red);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;line-height:1.1;text-align:center}
.stamp b{font-family:"Jost",sans-serif;font-weight:600}
.gift{display:flex;align-items:center;background:var(--cream);color:var(--ink);font-weight:900;white-space:nowrap;border-radius:999px;border:3px solid var(--pink)}
.gift b{color:var(--pink-d);font-family:"Jost",sans-serif;font-weight:600}
.gift em{font-style:normal;color:#fff;background:var(--pink);border-radius:999px;font-family:"Jost",sans-serif;font-weight:600;letter-spacing:.06em}
.date{display:flex;align-items:center;white-space:nowrap}
.date .d{font-family:"Jost",sans-serif;font-weight:500}
.date .w{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--pink);color:var(--ink);font-weight:900}
.date .t{font-family:"Jost",sans-serif;font-weight:500;color:var(--pink-l)}
.date .ar{border-top:3px solid var(--pink);border-right:3px solid var(--pink);transform:rotate(45deg)}
.logo{position:absolute;background:#fff;border-radius:8px}
.logo img{display:block;width:auto}

/* ===== 1600x900 ===== */
.s900 .bn{height:900px}
.s900 .stage{left:0;top:0;width:760px;height:900px}
.s900 .halo{left:110px;top:170px;width:560px;height:700px}
.s900 .bt{width:120px}
.s900 .b1{left:120px;bottom:70px;width:112px}
.s900 .b2{left:222px;bottom:110px}
.s900 .b3{left:330px;bottom:130px;width:128px;z-index:2}
.s900 .b4{left:452px;bottom:110px}
.s900 .b5{left:556px;bottom:70px;width:112px}
.s900 .pf{width:62px}
.s900 .logo{left:46px;top:40px;padding:10px 16px}.s900 .logo img{height:36px}
.s900 .copy{position:absolute;left:760px;right:50px;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.s900 .kick{font-size:40px;letter-spacing:.08em}
.s900 .neon{margin-top:16px;font-size:132px}
.s900 .cpw{position:relative;margin-top:30px;padding:18px 40px 22px;border:3px solid var(--pink);border-radius:14px;background:#140c13;box-shadow:0 0 30px #ff4f9a55}
.s900 .cp{gap:14px}
.s900 .cp .lb{font-size:42px;writing-mode:vertical-rl;letter-spacing:.12em;line-height:1;align-self:center}
.s900 .cp .n{font-size:200px}
.s900 .cp .o{font-size:76px;padding-bottom:10px}
.s900 .cp .o small{font-size:28px;margin-top:8px}
.s900 .stamp{position:absolute;right:-34px;top:-34px;width:118px;height:118px;font-size:19px;box-shadow:0 6px 20px #000a}
.s900 .stamp b{font-size:38px}
.s900 .later{margin-top:10px;font-size:22px;font-weight:700;color:var(--pink-l)}
.s900 .gift{margin-top:24px;gap:12px;padding:10px 26px 10px 12px;font-size:29px}
.s900 .gift em{font-size:20px;padding:8px 16px}
.s900 .gift b{font-size:40px;margin:0 2px}
.s900 .date{position:absolute;left:0;right:0;bottom:0;height:86px;justify-content:center;gap:16px;background:#0c0a0dee;border-top:1px solid #ff4f9a66}
.s900 .date .d{font-size:48px}
.s900 .date .w{width:34px;height:34px;font-size:19px}
.s900 .date .t{font-size:30px}
.s900 .date .ar{width:22px;height:22px;margin:0 6px 0 -4px}

/* ===== 1600x311 ===== */
.s311 .bn{height:311px}
.s311 .stage{left:430px;top:0;width:420px;height:311px}
.s311 .halo{left:40px;top:10px;width:340px;height:330px}
.s311 .bt{width:58px;bottom:-6px}
.s311 .b1{left:62px;width:54px;bottom:-14px}
.s311 .b2{left:114px}
.s311 .b3{left:176px;width:64px;z-index:2;bottom:-2px}
.s311 .b4{left:244px}
.s311 .b5{left:304px;width:54px;bottom:-14px}
.s311 .pf{width:34px}
.s311 .logo{left:30px;top:22px;padding:5px 10px}.s311 .logo img{height:22px}
.s311 .left{position:absolute;left:30px;top:62px;width:400px;text-align:center}
.s311 .kick{font-size:24px;letter-spacing:.06em}
.s311 .neon{margin-top:8px;font-size:78px;line-height:.92}
.s311 .right{position:absolute;left:870px;right:30px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px}
.s311 .row{display:flex;align-items:center;gap:22px}
.s311 .cp{gap:10px}
.s311 .cp .lb{font-size:32px;writing-mode:vertical-rl;letter-spacing:.1em;line-height:1;align-self:center}
.s311 .cp .n{font-size:172px}
.s311 .cp .o{font-size:64px;padding-bottom:8px}
.s311 .cp .o small{font-size:21px;margin-top:6px}
.s311 .stamp{width:110px;height:110px;font-size:17px}
.s311 .stamp b{font-size:36px}
.s311 .gift{gap:12px;padding:7px 26px 7px 10px;font-size:29px;border-width:2px}
.s311 .gift em{font-size:15px;padding:5px 12px}
.s311 .gift b{font-size:38px}
.s311 .date{position:absolute;left:30px;bottom:22px;width:400px;justify-content:center;gap:8px}
.s311 .date .d{font-size:30px}
.s311 .date .w{width:22px;height:22px;font-size:12px}
.s311 .date .t{font-size:19px}
.s311 .date .ar{width:12px;height:12px;margin:0 2px 0 -4px;border-width:2px}
</style>
</head>
<body>
<script>document.body.className='s'+((location.search.match(/s=(\d+)/)||[])[1]||'900');</script>

<div class="bn">
  <!-- 星・流れ星 -->
  <i class="tw" style="left:6%;top:16%;--s:26px"></i><i class="tw" style="left:44%;top:10%;--s:34px"></i>
  <i class="tw" style="left:96%;top:12%;--s:22px"></i><i class="tw" style="left:58%;top:86%;--s:20px"></i>
  <i class="tw" style="left:30%;top:6%;--s:18px"></i><i class="tw" style="left:88%;top:80%;--s:28px"></i>
  <i class="tw" style="left:4%;top:74%;--s:20px"></i><i class="tw" style="left:66%;top:22%;--s:16px"></i>
  <b class="mt" style="left:52%;top:4%"></b><b class="mt" style="left:100%;top:40%"></b>

  <a class="logo"><img src="../images/logo-wide.jpg" alt=""></a>

  <div class="stage">
    <span class="halo"></span>
    <img class="pf" src="../images/pk-mik.png" style="left:9%;top:24%;transform:rotate(-18deg)">
    <img class="pf" src="../images/pk-zak.png" style="left:2%;top:56%;transform:rotate(14deg)">
    <img class="pf" src="../images/pk-wak.png" style="right:6%;top:20%;transform:rotate(16deg)">
    <img class="pf" src="../images/pk-std.png" style="right:1%;top:52%;transform:rotate(-10deg)">
    <img class="pf" src="../images/pk-ume.png" style="left:48%;top:4%;transform:rotate(-24deg);opacity:.9">
    <img class="bt b1" src="../images/bt-wak.png">
    <img class="bt b2" src="../images/bt-ume.png">
    <img class="bt b3" src="../images/bt-std.png">
    <img class="bt b4" src="../images/bt-zak.png">
    <img class="bt b5" src="../images/bt-mik.png">
  </div>

  <!-- 1600x900 用 -->
  <div class="copy" data-only="900">
    <p class="kick">ファスティングはじめるなら今！</p>
    <h1 class="neon">BLACK<br>FRIDAY</h1>
    <div class="cpw">
      <p class="cp"><span class="lb">店内全品</span><span class="n pk">15</span><span class="o pk">%OFF<small>COUPON</small></span></p>
      <span class="stamp">先着<b>200</b>名様</span>
    </div>
    <p class="later">11/20 23:59まで　その後も店内全品10%OFF</p>
    <p class="gift"><em>PRESENT</em>2,000円以上で酵素ドリンク<b>2</b>包プレゼント</p>
  </div>
  <div class="date" data-only="900">
    <span class="d">11.19</span><span class="w">木</span><span class="t">20:00</span><span class="ar"></span>
    <span class="d">11.25</span><span class="w">水</span><span class="t">1:59</span>
  </div>

  <!-- 1600x311 用 -->
  <div class="left" data-only="311">
    <p class="kick">ファスティングはじめるなら今！</p>
    <h1 class="neon">BLACK FRIDAY</h1>
  </div>
  <div class="date" data-only="311">
    <span class="d">11.19</span><span class="w">木</span><span class="t">20:00</span><span class="ar"></span>
    <span class="d">11.25</span><span class="w">水</span><span class="t">1:59</span>
  </div>
  <div class="right" data-only="311">
    <div class="row">
      <p class="cp"><span class="lb">店内全品</span><span class="n pk">15</span><span class="o pk">%OFF<small>COUPON</small></span></p>
      <span class="stamp">先着<b>200</b>名様</span>
    </div>
    <p class="gift"><em>PRESENT</em>2,000円以上で<b>2</b>包プレゼント</p>
  </div>
</div>
<script>
var s=document.body.className.slice(1);
document.querySelectorAll('[data-only]').forEach(function(e){if(e.getAttribute('data-only')!==s)e.remove();});
document.querySelector('.neon').innerHTML = s==='311' ? 'BLACK FRIDAY' : 'BLACK<br>FRIDAY';
</script>
</body>
</html>
